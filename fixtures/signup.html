<!doctype html><html><body><form id="signup"><input id="email" type="email"><button id="submit" type="submit">Submit</button><div id="message"></div></form><script>const form=document.querySelector("#signup"),email=document.querySelector("#email"),message=document.querySelector("#message");email.addEventListener("input",()=>{message.textContent=email.value.includes("@")?"valid":"invalid";});form.addEventListener("submit",event=>{event.preventDefault();message.textContent=email.value.includes("@")?"submitted":"invalid";});</script></body></html>
