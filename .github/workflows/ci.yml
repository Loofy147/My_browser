name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # package-lock.json is not committed yet. Generate it from the clean
      # checkout, then require npm ci to consume exactly that resolved graph.
      # This is intentionally not described as committed-lock reproducibility.
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm test

      # Running twice is an explicit idempotency check for the end-to-end writer.
      - run: npm start
      - run: npm start
      - run: test -f dashboard/index.html
      - run: test -f data/toolkit.db
      - run: git diff --exit-code -- package-lock.json
