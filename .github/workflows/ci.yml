name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The repository intentionally has no committed package-lock.json yet.
      # Generate the lock from the clean manifest twice and require identical
      # results before letting npm ci consume it. This is manifest-level
      # reproducibility, not committed-lock reproducibility.
      - run: npm install --package-lock-only --ignore-scripts
      - run: cp package-lock.json /tmp/package-lock.first.json
      - run: rm package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - run: cmp --silent /tmp/package-lock.first.json package-lock.json
      - run: npm ci --ignore-scripts

      - run: npm test

      # Running twice is an explicit idempotency check for the end-to-end writer.
      - run: npm start
      - run: npm start
      - run: test -f dashboard/index.html
      - run: test -f data/toolkit.db
